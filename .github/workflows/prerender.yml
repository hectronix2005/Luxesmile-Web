name: Build (imágenes WebP + pre-render SEO)

# Cuando el admin publica (cambia content.json con imágenes base64), este flujo:
#   1. Extrae las imágenes base64 a archivos .webp y reescribe content.json a rutas.
#   2. Regenera el contenido SEO estático de index.html.
# Luego commitea los cambios. El commit lo hace GITHUB_TOKEN, que por diseño NO
# vuelve a disparar el workflow (evita bucles).
on:
  push:
    branches: [main]
    paths:
      - 'assets/data/content.json'
      - 'scripts/extract-images.mjs'
      - 'scripts/prerender.mjs'
      - 'scripts/build-blog.mjs'
      # Sin estas dos, editar la fuente de una pieza duplicada no la propagaba: el
      # build que lo haria no se disparaba. Anadido el 17-sep-2026, el mismo dia en
      # que `npm test` resulto no ejecutarse nunca por esta misma razon.
      - 'scripts/sync-fuentes.mjs'
      - 'scripts/fragmentos/**'
      - 'package.json'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-content
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      # content.json manda sobre lo que está duplicado: la paleta de
      # styles.css, el bloque de contacto de DEFAULT_CONTENT y el número
      # escrito a mano. Sin esto vuelven a divergir en silencio (17-sep-2026).
      # Hasta el 17-sep-2026 el detector de enrutado no lo ejecutaba nadie: ni npm
      # ni el Action. Llevaba desde el 15-sep sin correr una sola vez, y tenía un
      # fallo esperándole dentro. Un detector que no se ejecuta cuesta lo mismo
      # que uno que nunca se pone rojo.
      - name: Comprobaciones (enrutado a WhatsApp + guardas del admin)
        run: npm test

      - name: Sincronizar fuentes duplicadas con content.json
        run: node scripts/sync-fuentes.mjs

      - name: Extraer imágenes base64 → WebP
        run: node scripts/extract-images.mjs

      - name: Regenerar HTML pre-renderizado
        run: node scripts/prerender.mjs

      - name: Generar páginas estáticas del blog + sitemap
        run: node scripts/build-blog.mjs

      - name: Compilar Tailwind CSS
        run: npm run build:css

      # Y OTRA VEZ DESPUES DEL BUILD, antes de commitear.
      # El `npm test` de arriba valida el estado ANTERIOR: comprueba el sitemap,
      # las fuentes y las paginas tal y como llegaron al checkout. Si uno de los
      # pasos de build genera algo roto —un sitemap con fechas de estreno, una
      # pagina pidiendo una imagen que otro paso acaba de borrar— nadie lo mira y
      # se commitea igual; el fallo aparece en el push SIGUIENTE, atribuido a
      # quien no lo causo. Esto es barato y cierra el hueco.
      - name: Comprobaciones sobre lo que se va a commitear
        run: npm test

      # LA LISTA FIJA SE COMIA SIETE DE LOS OCHO FICHEROS DEL SINCRONIZADOR.
      #
      # Aqui habia un `git add` con seis rutas a mano. `sync-fuentes.mjs` escribe
      # OCHO ficheros —styles.css, content.js y seis paginas— y de esos solo
      # `index.html` estaba en la lista. O sea que el paso de arriba hacia su
      # trabajo, lo imprimia en el log, y el commit se dejaba fuera la paleta, el
      # bloque de contacto del fallback y el telefono de cinco paginas.
      #
      # Comprobado en el historial el 17-sep-2026: en todas sus ejecuciones el bot
      # NUNCA ha commiteado assets/css/styles.css, assets/js/content.js,
      # diseno-de-sonrisa, en/smile-design, pacientes-internacionales, privacidad
      # ni wa. Cada build rehacia la misma sincronizacion y la tiraba.
      #
      # Es justo lo que sync-fuentes existe para impedir: que el numero de la
      # doctora y la paleta diverjan en silencio. En CI divergian igual, con el
      # flujo en verde y el paso imprimiendo los cambios que nadie guardaba.
      #
      # `-A` en vez de una lista: asi un paso de build que empiece a escribir un
      # fichero nuevo no vuelve a caerse por el mismo agujero. node_modules y
      # .DS_Store estan en .gitignore.
      - name: Commit si hubo cambios
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios; nada que commitear."
          else
            git config user.name "luxe-build[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(build): extraer imágenes a WebP y regenerar SEO estático"
            git push
          fi
